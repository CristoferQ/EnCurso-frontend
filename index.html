<!doctype html>
<html lang="es" class="bg-[#050505] text-zinc-100">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnCurso</title>
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>

<body class="px-4 py-5 md:px-8 md:py-6 max-w-7xl mx-auto">
  <div id="app">
    <!-- Header compacto de alto contraste -->
    <header class="flex flex-col md:flex-row md:items-end justify-between pb-4 mb-5 border-b border-zinc-800 gap-3">
      <div>
        <h1 class="text-3xl md:text-5xl font-semibold tracking-normal bg-sky-600 text-white px-2 py-0.5 rounded leading-none inline-block">
          EnCurso
        </h1>
      </div>
      <p class="bg-sky-600 text-white text-xs md:text-sm font-medium tracking-wide px-2 py-0.5 rounded inline-block">
        Siempre en curso, siempre creciendo.
      </p>
    </header>

    <main>
      <!-- Banner de Curso Destacado (Skeleton Inicial) -->
      <div id="banner-container">
        <div class="w-full h-48 md:h-64 mb-6 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse flex flex-col justify-end p-6 gap-3">
          <div class="h-4 w-32 bg-zinc-800 rounded"></div>
          <div class="h-8 w-3/4 md:w-1/2 bg-zinc-800 rounded"></div>
          <div class="h-4 w-1/3 bg-zinc-800 rounded"></div>
        </div>
      </div>

      <!-- Barra de sección compacta -->
      <div class="flex items-center justify-between mb-4 pt-2">
        <h2 class="text-lg md:text-xl font-black uppercase tracking-wider text-white flex items-center gap-2">
          <span class="w-2 h-5 bg-sky-600 rounded-xs inline-block"></span>
          Cursos
        </h2>
        <span id="contador-courses" class="text-[11px] font-extrabold uppercase tracking-wider text-zinc-300 bg-zinc-900 px-3 py-1 rounded border border-zinc-800 inline-flex items-center gap-1.5">
          <svg class="animate-spin h-3 w-3 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Cargando cursos...</span>
        </span>
      </div>

      <!-- Grid de Cartelera Tighter (gap-5) con Skeletons Iniciales -->
      <div id="courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch">
        <div class="h-72 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse p-4 flex flex-col justify-between">
          <div class="h-32 w-full bg-zinc-800 rounded-lg mb-3"></div>
          <div class="space-y-2">
            <div class="h-5 w-3/4 bg-zinc-800 rounded"></div>
            <div class="h-4 w-1/2 bg-zinc-800 rounded"></div>
          </div>
          <div class="h-8 w-full bg-zinc-800 rounded mt-3"></div>
        </div>
        <div class="h-72 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse p-4 flex flex-col justify-between">
          <div class="h-32 w-full bg-zinc-800 rounded-lg mb-3"></div>
          <div class="space-y-2">
            <div class="h-5 w-3/4 bg-zinc-800 rounded"></div>
            <div class="h-4 w-1/2 bg-zinc-800 rounded"></div>
          </div>
          <div class="h-8 w-full bg-zinc-800 rounded mt-3"></div>
        </div>
        <div class="h-72 rounded-xl bg-zinc-900 border border-zinc-800 animate-pulse p-4 flex flex-col justify-between">
          <div class="h-32 w-full bg-zinc-800 rounded-lg mb-3"></div>
          <div class="space-y-2">
            <div class="h-5 w-3/4 bg-zinc-800 rounded"></div>
            <div class="h-4 w-1/2 bg-zinc-800 rounded"></div>
          </div>
          <div class="h-8 w-full bg-zinc-800 rounded mt-3"></div>
        </div>
      </div>

      <!-- Formulario de inscripcion -->
      <div id="enroll-container" class="mt-8"></div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
